name: PR Performance Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-perf
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/kaihowl/git-perf/releases/latest/download/git-perf-installer.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Configure Git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pull latest measurements
        run: git perf pull

      - name: Measure build time
        run: git perf measure -m build_time -n 3 -- npm run build

      - name: Measure test duration
        run: git perf measure -m test_duration -n 3 -- npm run test:unit

      - name: Run audit and capture results
        id: audit
        run: |
          echo "## Performance Audit Results" > audit_results.md
          echo "" >> audit_results.md

          echo "### Build Time" >> audit_results.md
          if git perf audit -m build_time > build_audit.txt 2>&1; then
            echo '```' >> audit_results.md
            cat build_audit.txt >> audit_results.md
            echo '```' >> audit_results.md
          else
            echo "No baseline measurements available yet." >> audit_results.md
          fi
          echo "" >> audit_results.md

          echo "### Test Duration" >> audit_results.md
          if git perf audit -m test_duration > test_audit.txt 2>&1; then
            echo '```' >> audit_results.md
            cat test_audit.txt >> audit_results.md
            echo '```' >> audit_results.md
          else
            echo "No baseline measurements available yet." >> audit_results.md
          fi

      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const auditResults = fs.readFileSync('audit_results.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: auditResults
            });
