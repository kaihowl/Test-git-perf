name: Performance Tracking

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  track-performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for full git history

      - name: Install git-perf
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/kaihowl/git-perf/releases/latest/download/git-perf-installer.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Configure Git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Measure build time
        run: |
          git perf measure -m build_time -n 3 -- npm run build

      - name: Measure test duration
        run: |
          git perf measure -m test_duration -n 3 -- npm run test:unit

      - name: Run audit for regressions
        run: |
          git perf audit -m build_time || echo "No baseline yet for build_time"
          git perf audit -m test_duration || echo "No baseline yet for test_duration"

      - name: Push measurements
        if: github.ref == 'refs/heads/main'
        run: git perf push
